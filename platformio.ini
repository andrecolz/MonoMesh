[env:m5paper-mono]
platform = espressif32 @ 6.12.0
board = esp32-s3-devkitc-1
framework = arduino

board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = partitions_16mb.csv

build_flags = 
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1
    -D CORE_DEBUG_LEVEL=3
    ; The map view does its work in loop(): the default 8 KB task stack left no
    ; margin for the UI + drawing + tile paths stacked together.
    -D ARDUINO_LOOP_STACK_SIZE=16384
    -O2

monitor_speed = 115200

lib_deps =
    m5stack/M5Unified @ ^0.2.21
    m5stack/M5GFX @ ^0.2.26
    m5stack/M5PM1 @ ^1.0.7
    m5stack/M5IOE1 @ ^1.0.9
    jgromes/RadioLib @ ^7.7.1
