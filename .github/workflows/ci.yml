name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tools:
    name: Map tools and tests (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements.txt

      - name: Install fonts used by the label tests
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Run tests
        run: python3 -m unittest discover -s tools/tests -v

  firmware:
    name: Build firmware M5Paper Mono
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}

      - name: Installa PlatformIO
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install platformio

      - name: Build
        run: pio run -e m5paper-mono
